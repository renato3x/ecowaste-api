services:
  mysql:
    image: mysql:8.4
    container_name: mysql-ecowaste
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecowaste
      MYSQL_USER: ecowaste
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: